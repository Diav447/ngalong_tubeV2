name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Fix pubspec.yaml
        run: |
          cat > pubspec.yaml << 'EOF'
          name: ngalong_tube_v2
          description: NgalongTube V2 Anti Blokir
          publish_to: 'none'
          version: 2.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            http: ^1.2.0
            url_launcher: ^6.2.5
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
          flutter:
            uses-material-design: true
          EOF

      - name: Create android folder if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create . --project-name ngalong_tube_v2 --org com.ngalongtube --platforms android
          fi

      - name: Fix Kotlin version (1.7 -> 1.9)
        run: |
          sed -i "s/1.7.10/1.9.22/g" android/build.gradle || true
          sed -i "s/1.7.1/1.9.22/g" android/build.gradle || true
          sed -i "s/1.7.10/1.9.22/g" android/settings.gradle || true
          sed -i "s/1.7.1/1.9.22/g" android/settings.gradle || true
          sed -i "s/1.7.10/1.9.22/g" android/app/build.gradle || true
          cat android/build.gradle | grep kotlin

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: NgalongTube-V2-APK
          path: build/app/outputs/flutter-apk/app-release.apk
