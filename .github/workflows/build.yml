name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6' # <-- INI KUNCINYA, DOWNGRADE DARI 3.22.0
          channel: 'stable'
          cache: false

      - name: Fix manual android folder (auto-regenerate)
        run: |
          rm -rf android
          flutter create . --project-name ngalong_tubev2 --platforms=android

      - run: flutter clean
      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: NGALONG-TUBE-V2-APK
          path: build/app/outputs/flutter-apk/app-release.apk
