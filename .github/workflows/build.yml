name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Create android folder proper
        run: |
          rm -rf android
          flutter create --project-name ngalong_tube_v2 --org com.ngalongtube --platforms android .

      - name: Fix pubspec.yaml
        run: |
          cat > pubspec.yaml <<'EOPY'
          name: ngalong_tube_v2
          description: NgalongTube V2 Anti Blokir
          publish_to: 'none'
          version: 2.0.0+10
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            http: ^1.2.0
            url_launcher: ^6.2.5
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
          flutter:
            uses-material-design: true
          EOPY

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: NgalongTube-V10-FINAL
          path: build/app/outputs/flutter-apk/app-release.apk
